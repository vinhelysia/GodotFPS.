<title id="title">Town concept B — crossroads village and municipal transport depot</title><desc id="desc">Proposal only. 200 by 200 metres, north up. 33 structures, 14 reusable types. Spawn southwest; extraction northeast and southeast. Dark asphalt main road, gravel village lanes, dotted pedestrian paths. Buildings labelled by catalogue ID; dot marks front entrance; plus marks an accessible upper floor. Green areas are planting zones, not exact tree placements.</desc>
